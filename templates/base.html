<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipment Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header>
      <h1>Officer Equipment Checkout</h1>
      <nav>
        <a href="{{ url_for('home') }}">Badge Scan</a>
        <a href="{{ url_for('register_officer') }}">Register Officer</a>
        <a href="{{ url_for('equipment_register') }}">Equipment</a>
        <a href="{{ url_for('audit') }}">Audit</a>
      </nav>
    </header>

    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <ul class="flash-list">
        {% for category, message in messages %}
        <li class="flash {{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
